project_id = "meetqt"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seeds/demo_users.sql", "./seeds/local_accounts.sql", "./seeds/local_events.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "4MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enabled = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your MeetQ account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your MeetQ password"
content_path = "./supabase/templates/recovery.html"

[analytics]
enabled = false
